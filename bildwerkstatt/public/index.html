<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bild-Werkstatt</title>
<style>
 body{margin:0;font:18px/1.5 system-ui,Segoe UI,sans-serif;background:#eef3fb;color:#14213d}
 main{max-width:760px;margin:0 auto;padding:24px}
 h1{margin:0 0 8px}
 .karte{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0002;margin-top:16px}
 label{display:block;font-weight:600;margin:10px 0 4px}
 input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:2px solid #b8c4da;border-radius:8px;background:#fff}
 button,a.knopf{display:inline-block;margin-top:14px;font:inherit;font-weight:700;padding:12px 24px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;cursor:pointer;text-decoration:none}
 button:disabled{background:#8a97ad;cursor:wait}
 img{max-width:100%;border-radius:8px;display:block}
 #status{margin-top:12px;font-weight:600}
 small{font-size:15px;color:#43506b}
</style>
</head>
<body>
<main>
 <h1>🎨 Bild-Werkstatt</h1>
 <div>Erst gut überlegen, dann erzeugen: Du hast 8 Bilder pro Tag.</div>
 <form class="karte" id="f">
  <label for="pw">Klassen-Passwort</label>
  <input id="pw" type="password" autocomplete="off" required>
  <label for="p">Was soll auf dem Bild sein?</label>
  <textarea id="p" rows="4" maxlength="600" placeholder="Motiv, Handlung, Ort, Licht, Stil …" required></textarea>
  <button id="b">Bild erzeugen</button>
  <div id="status" role="status"></div>
  <small>Gib keine Namen oder persönlichen Daten ein.</small>
 </form>
 <div id="bilder"></div>
</main>
<script>
const $ = id => document.getElementById(id);
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("b").disabled = true; $("status").textContent = "Das Bild wird gemalt …";
  try {
    const r = await fetch("/api/bild", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passwort: $("pw").value, prompt: $("p").value }) });
    const d = await r.json();
    if (!r.ok) { $("status").textContent = d.fehler; return; }
    const k = document.createElement("div"); k.className = "karte";
    const i = document.createElement("img"); i.src = d.bild; i.alt = $("p").value;
    const a = document.createElement("a"); a.className = "knopf"; a.href = d.bild; a.download = "mein-bild-" + Date.now() + ".jpg"; a.textContent = "Bild speichern";
    k.append(i, a); $("bilder").prepend(k);
    $("status").textContent = "Fertig! Noch " + d.rest + " Bilder für heute.";
  } catch { $("status").textContent = "Keine Verbindung. Bitte noch einmal versuchen."; }
  finally { $("b").disabled = false; }
});
</script>
</body>
</html>
